<!DOCTYPE html>
<html>
<head>
  <title>ODD - Opening App...</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: white;
    }
    .container { text-align: center; }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid rgba(255,255,255,0.3);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    a { color: #3b82f6; }
  </style>
</head>
<body>
  <div class="container">
    <h1 id="title">Opening App...</h1>
    <div class="spinner"></div>
    <p id="message">Redirecting...</p>
  </div>
  <script>
    // App registry - maps app IDs to their custom URL schemes
    const APP_SCHEMES = {
      'vai-studio': 'vai-studio',
      // Add more apps here as needed
    };

    // Default app if none specified
    const DEFAULT_APP = 'vai-studio';

    // Get query params and hash
    const urlParams = new URLSearchParams(window.location.search);
    const hash = window.location.hash;

    // Get app from query param (passed via emailRedirectTo)
    const appId = urlParams.get('app') || DEFAULT_APP;
    const scheme = APP_SCHEMES[appId] || APP_SCHEMES[DEFAULT_APP];

    document.getElementById('title').textContent = `Opening ${appId}...`;

    if (hash) {
      // Build deep link with tokens
      const deepLink = `${scheme}://auth/callback${hash}`;
      window.location.href = deepLink;

      // Fallback message
      setTimeout(() => {
        document.getElementById('message').innerHTML =
          `If the app didn't open, <a href="${deepLink}">click here</a>`;
      }, 2000);
    } else {
      document.getElementById('message').textContent = 'No authentication data found.';
    }
  </script>
</body>
</html>
